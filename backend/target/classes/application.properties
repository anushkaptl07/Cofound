spring.application.name=cofoundhub-backend

# --- Database (env vars used on Render, fallback for local dev) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cofoundhub}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
jwt.secret=${JWT_SECRET:ChangeThisToALongRandomSecretKeyForJWTSigning123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Server ---
server.port=${PORT:8080}

# --- CORS (frontend URL, comma separated if multiple) ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
